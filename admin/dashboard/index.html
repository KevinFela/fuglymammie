<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fuglymammie CMS — Dashboard</title>


    <!-- =========================
         FAVICON
    ========================== -->

    <link
        rel="icon"
        type="image/png"
        href="/favicon.png"
    >


    <!-- =========================
         ADMIN CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="/admin/admin.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="admin-header">


        <a
            href="/"
            class="admin-brand"
        >
            Fuglymammie
        </a>


        <div class="dashboard-header-right">


            <span class="admin-label">
                CMS
            </span>


            <button
                id="logout-button"
                class="text-button"
                type="button"
            >
                Log out
            </button>


        </div>


    </header>



    <!-- =========================================
         DASHBOARD
    ========================================== -->

    <main class="dashboard-page">


        <!-- SIDEBAR -->

        <aside class="dashboard-sidebar">


            <nav class="dashboard-nav">


                <button
                    class="dashboard-nav-button active"
                    data-section="overview"
                    type="button"
                >
                    Dashboard
                </button>


                <button
                    class="dashboard-nav-button"
                    data-section="events"
                    type="button"
                >
                    Events
                </button>


                <button
                    class="dashboard-nav-button"
                    data-section="subscribers"
                    type="button"
                >
                    Subscribers
                </button>


            </nav>


        </aside>



        <!-- =====================================
             CONTENT
        ====================================== -->

        <div class="dashboard-content">


            <!-- ===============================
                 OVERVIEW
            ================================ -->

            <section
                id="overview-section"
                class="dashboard-section active"
            >


                <div class="dashboard-section-header">


                    <div>

                        <p class="small-label">
                            OVERVIEW
                        </p>

                        <h1>
                            Dashboard
                        </h1>

                    </div>


                </div>



                <div class="stats-grid">


                    <div class="stat-card">

                        <span class="stat-label">
                            Total events
                        </span>

                        <strong
                            class="stat-number"
                            id="total-events"
                        >
                            —
                        </strong>

                    </div>



                    <div class="stat-card">

                        <span class="stat-label">
                            Upcoming
                        </span>

                        <strong
                            class="stat-number"
                            id="upcoming-events-count"
                        >
                            —
                        </strong>

                    </div>



                    <div class="stat-card">

                        <span class="stat-label">
                            Subscribers
                        </span>

                        <strong
                            class="stat-number"
                            id="subscriber-count"
                        >
                            —
                        </strong>

                    </div>


                </div>



                <div class="dashboard-block">


                    <p class="small-label">
                        QUICK ACTION
                    </p>


                    <button
                        id="overview-add-event"
                        class="primary-admin-button"
                        type="button"
                    >
                        + Add Event
                    </button>


                </div>


            </section>



            <!-- ===============================
                 EVENTS
            ================================ -->

            <section
                id="events-section"
                class="dashboard-section"
            >


                <div class="dashboard-section-header">


                    <div>

                        <p class="small-label">
                            WEBSITE
                        </p>

                        <h1>
                            Events
                        </h1>

                    </div>



                    <button
                        id="add-event-button"
                        class="primary-admin-button"
                        type="button"
                    >
                        + Add Event
                    </button>


                </div>



                <div
                    id="admin-events-list"
                    class="admin-list"
                >

                    <p class="dashboard-loading">
                        Loading events...
                    </p>

                </div>


            </section>



            <!-- ===============================
                 SUBSCRIBERS
            ================================ -->

            <section
                id="subscribers-section"
                class="dashboard-section"
            >


                <div class="dashboard-section-header">


                    <div>

                        <p class="small-label">
                            NETWORK
                        </p>

                        <h1>
                            Subscribers
                        </h1>

                    </div>


                </div>



                <div
                    id="subscriber-list"
                    class="admin-list"
                >

                    <p class="dashboard-loading">
                        Loading subscribers...
                    </p>

                </div>


            </section>


        </div>


    </main>



    <!-- =========================================
         ADD / EDIT EVENT MODAL
    ========================================== -->

    <div
        id="event-editor-modal"
        class="admin-modal-overlay"
    >


        <div class="admin-modal">


            <div class="admin-modal-header">


                <div>

                    <p class="small-label">
                        EVENT
                    </p>

                    <h2 id="event-form-heading">
                        Add Event
                    </h2>

                </div>



                <button
                    id="close-event-editor"
                    class="text-button"
                    type="button"
                >
                    [ x ]
                </button>


            </div>



            <form id="event-form">


                <input
                    type="hidden"
                    id="event-id"
                >



                <!-- TITLE -->

                <div class="form-group">

                    <label for="event-title">
                        Title
                    </label>

                    <input
                        type="text"
                        id="event-title"
                        class="form-input"
                        required
                    >

                </div>



                <!-- DATE -->

                <div class="form-group">

                    <label for="event-date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="event-date"
                        class="form-input"
                        required
                    >

                </div>



                <!-- LOCATION -->

                <div class="form-group">

                    <label for="event-location">
                        Location
                    </label>

                    <input
                        type="text"
                        id="event-location"
                        class="form-input"
                        placeholder="Johannesburg"
                    >

                </div>



                <!-- DESCRIPTION -->

                <div class="form-group">

                    <label for="event-description">
                        Description
                    </label>

                    <textarea
                        id="event-description"
                        class="form-input admin-textarea"
                        rows="6"
                    ></textarea>

                </div>



                <!-- TICKET -->

                <div class="form-group">

                    <label for="event-ticket-url">
                        Ticket / Venue URL
                    </label>

                    <input
                        type="url"
                        id="event-ticket-url"
                        class="form-input"
                        placeholder="https://..."
                    >

                </div>



                <!-- STATUS -->

                <div class="form-group">

                    <label for="event-status">
                        Status
                    </label>

                    <select
                        id="event-status"
                        class="form-input"
                    >

                        <option value="upcoming">
                            Upcoming
                        </option>

                        <option value="postponed">
                            Postponed
                        </option>

                        <option value="cancelled">
                            Cancelled
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                        <option value="draft">
                            Draft
                        </option>

                    </select>

                </div>



                <!-- PUBLISHED -->

                <div class="checkbox-row">

                    <input
                        type="checkbox"
                        id="event-published"
                        checked
                    >

                    <label for="event-published">
                        Published on website
                    </label>

                </div>



                <p
                    id="event-form-message"
                    class="login-message"
                ></p>



                <button
                    type="submit"
                    class="login-button"
                    id="save-event-button"
                >
                    Publish Event
                </button>


            </form>


        </div>


    </div>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="admin-footer">


        <a href="/">
            ← View website
        </a>


        <span>

            ©
            <span id="admin-year"></span>
            Fuglymammie

        </span>


    </footer>



    <!-- =========================================
         SUPABASE
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =========================================
         DASHBOARD JS
    ========================================== -->

    <script src="/admin/dashboard.js"></script>


</body>

</html>
