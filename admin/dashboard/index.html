<form id="event-form">

    <input
        type="hidden"
        id="event-id"
    >


    <!-- TITLE -->

    <div class="form-group">

        <label for="event-title">
            Title
        </label>

        <input
            type="text"
            id="event-title"
            class="form-input"
            required
        >

    </div>


    <!-- DATE -->

    <div class="form-group">

        <label for="event-date">
            Date
        </label>

        <input
            type="date"
            id="event-date"
            class="form-input"
            required
        >

    </div>


    <!-- LOCATION -->

    <div class="form-group">

        <label for="event-location">
            Location
        </label>

        <input
            type="text"
            id="event-location"
            class="form-input"
            placeholder="Johannesburg"
        >

    </div>


    <!-- DESCRIPTION -->

    <div class="form-group">

        <label for="event-description">
            Description
        </label>

        <textarea
            id="event-description"
            class="form-input admin-textarea"
            rows="6"
            placeholder="Tell visitors about the event..."
        ></textarea>

    </div>


    <!-- ENTRY TYPE -->

    <div class="form-group">

        <label for="event-entry-type">
            Entry Type
        </label>

        <select
            id="event-entry-type"
            class="form-input"
        >

            <option value="free">
                Free Event
            </option>

            <option value="ticketed">
                Ticketed
            </option>

            <option value="rsvp">
                RSVP
            </option>

            <option value="invite_only">
                Invite Only
            </option>

        </select>

    </div>


    <!-- TICKET / RSVP URL -->

    <div
        class="form-group"
        id="ticket-url-group"
    >

        <label
            for="event-ticket-url"
            id="ticket-url-label"
        >
            Ticket / RSVP / Info URL
        </label>

        <input
            type="url"
            id="event-ticket-url"
            class="form-input"
            placeholder="https://..."
        >

        <small class="field-help">
            Optional. Free events can leave this empty.
        </small>

    </div>


    <!-- EVENT POSTER -->

    <div class="form-group">

        <label for="event-image">
            Event Poster / Image
        </label>

        <input
            type="file"
            id="event-image"
            class="form-input"
            accept="image/jpeg,image/png,image/webp,image/gif"
        >

        <input
            type="hidden"
            id="existing-image-url"
        >

        <div
            id="event-image-preview"
            class="event-image-preview"
        ></div>

        <small class="field-help">
            JPG, PNG, WEBP or GIF.
        </small>

    </div>


    <!-- VIDEO -->

    <div class="form-group">

        <label for="event-video-url">
            Video Link
        </label>

        <input
            type="url"
            id="event-video-url"
            class="form-input"
            placeholder="YouTube, TikTok or Instagram link"
        >

        <small class="field-help">
            Optional.
        </small>

    </div>


    <!-- EVENT STATUS -->

    <div class="form-group">

        <label for="event-status">
            Event Status
        </label>

        <select
            id="event-status"
            class="form-input"
        >

            <option value="upcoming">
                Upcoming
            </option>

            <option value="postponed">
                Postponed
            </option>

            <option value="cancelled">
                Cancelled
            </option>

            <option value="completed">
                Completed
            </option>

            <option value="draft">
                Draft
            </option>

        </select>

    </div>


    <!-- PUBLISHED -->

    <div class="checkbox-row">

        <input
            type="checkbox"
            id="event-published"
            checked
        >

        <label for="event-published">
            Published on website
        </label>

    </div>


    <p
        id="event-form-message"
        class="login-message"
    ></p>


    <button
        type="submit"
        class="login-button"
        id="save-event-button"
    >
        Publish Event
    </button>

</form>
