<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fuglymammie CMS</title>


    <!-- =========================
         FAVICON
    ========================== -->

    <link
        rel="icon"
        type="image/png"
        href="/favicon.png"
    >


    <!-- =========================
         ADMIN CSS
    ========================== -->

    <link
        rel="stylesheet"
        href="/admin/admin.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
    ========================================== -->

    <header class="admin-header">

        <a
            href="/"
            class="admin-brand"
        >
            Fuglymammie
        </a>


        <span class="admin-label">
            CMS
        </span>

    </header>



    <!-- =========================================
         LOGIN
    ========================================== -->

    <main class="login-page">


        <section class="login-box">


            <div class="login-heading">


                <p class="small-label">
                    FUGLYMAMMIE CMS
                </p>


                <h1>
                    Admin access.
                </h1>


                <p class="login-description">
                    Manage events, subscribers and website content.
                </p>


            </div>



            <form id="admin-login-form">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="admin-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        class="form-input"
                        placeholder="admin@email.com"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="admin-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="admin-password"
                        class="form-input"
                        placeholder="Password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- LOGIN -->

                <button
                    type="submit"
                    class="login-button"
                    id="login-button"
                >
                    Log in
                </button>



                <p
                    id="login-message"
                    class="login-message"
                ></p>


            </form>

        </section>

    </main>



    <!-- =========================================
         FOOTER
    ========================================== -->

    <footer class="admin-footer">


        <a href="/">
            ← Public website
        </a>


        <span>

            ©
            <span id="admin-year"></span>
            Fuglymammie

        </span>


    </footer>



    <!-- =========================================
         SUPABASE
    ========================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
    ></script>


    <!-- =========================================
         ADMIN JS
    ========================================== -->

    <script src="/admin/admin.js"></script>


</body>

</html>
